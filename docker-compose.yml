# HA Gatekeeper - Docker Compose stack for a single Linux server (VPS).
#
# You normally never edit or run this by hand: `sudo ./install.sh` asks for the settings,
# writes `.env`, generates the Caddy config, starts everything and checks that it works.
# To run it manually instead:
#
#   cp deploy/env.example .env        # then fill in the REQUIRED values
#   sudo ./install.sh secrets         # writes ./secrets/* from .env (the container reads secrets as files)
#   docker compose up -d --build
#
# Secrets (HA token, admin password, session and token-hash secrets) are NOT passed as container
# environment variables, because those are readable with `docker inspect` and in /proc. They are
# files in ./secrets (root-only directory), mounted read-only; the app reads them through the
# *_FILE variables below.
#
# Services
#   gatekeeper  API + admin UI. Always on. Published on 127.0.0.1 only, because Docker
#               bypasses UFW/firewalld for published ports; loopback is the only reliable way
#               to keep it private.
#   caddy       HTTPS reverse proxy on ports 80/443 with automatic certificates. Only started
#               when COMPOSE_PROFILES=proxy is set in .env (install.sh does this for you).

x-logging: &default-logging
  driver: json-file
  options:
    # Cap container logs (5 x 10 MB per container) so they can never fill the disk.
    max-size: "10m"
    max-file: "5"

services:
  gatekeeper:
    build:
      context: .
      dockerfile: Dockerfile
    image: ha-gatekeeper:local
    container_name: ha-gatekeeper
    # Restart on crash, on failed health check escalation (see deploy/watchdog.sh) and on
    # reboot, but not after an explicit `docker stop`.
    restart: unless-stopped
    # tini as PID 1: forwards signals (fast, clean stops) and reaps zombie processes.
    init: true
    # The app closes the database cleanly on SIGTERM; give it time, but never let a stop hang.
    stop_grace_period: 20s
    # Fences, not a diet: this server needs a small fraction of these. They stop a runaway process from
    # taking the rest of the machine (your other containers!) down with it; Docker then restarts it
    # (restart policy above) and the watchdog tells you. Raise them in .env if you ever need to.
    mem_limit: "${GATEKEEPER_MEM_LIMIT:-768m}"
    memswap_limit: "${GATEKEEPER_MEM_LIMIT:-768m}"
    pids_limit: 512
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: "file:/data/ha-gatekeeper.db"
      HA_BASE_URL: "${HA_BASE_URL:?HA_BASE_URL is not set - run ./install.sh, or copy deploy/env.example to .env and fill it in}"
      HA_TOKEN_FILE: /run/secrets/ha_token
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      ADMIN_SESSION_SECRET_FILE: /run/secrets/admin_session_secret
      API_KEY_HASH_SECRET_FILE: /run/secrets/api_key_hash_secret
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:8080}"
      AUDIT_LOG_RETENTION_DAYS: "${AUDIT_LOG_RETENTION_DAYS:-90}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # Set to 1 by install.sh when Caddy is in front, so audit logs and the admin-login rate
      # limit see the real client IP instead of the proxy's. Leave empty when not behind a proxy.
      TRUST_PROXY: "${TRUST_PROXY:-}"
      # Optional: trust a private CA for Home Assistant (path inside the container, under /certs).
      NODE_EXTRA_CA_CERTS: "${HA_CA_CERT:-}"
      # Alerts when Home Assistant is unreachable (see docs/ALERTS.md). All optional. The secret parts are
      # files below, like the other secrets; an empty file means "not set".
      ALERT_NAME: "${ALERT_NAME:-}"
      ALERT_EMAIL_TO: "${ALERT_EMAIL_TO:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"
      SMTP_SECURITY: "${SMTP_SECURITY:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      ALERT_NTFY_URL: "${ALERT_NTFY_URL:-}"
      ALERT_TELEGRAM_CHAT_ID: "${ALERT_TELEGRAM_CHAT_ID:-}"
      ALERT_WEBHOOK_URL_FILE: /run/secrets/alert_webhook_url
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      ALERT_NTFY_TOKEN_FILE: /run/secrets/alert_ntfy_token
      ALERT_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/alert_telegram_bot_token
    ports:
      - "${GATEKEEPER_BIND:-127.0.0.1}:${GATEKEEPER_PORT:-8080}:8080"
    volumes:
      # SQLite database. Must be writable by uid 1001 (install.sh takes care of this).
      - "${GATEKEEPER_DATA_DIR:-./data}:/data:z"
      - "./deploy/certs:/certs:ro,z"
      # One file per secret, read-only. install.sh creates them (mode 0400, uid 1001) inside the
      # root-only ./secrets directory before every start.
      - "./secrets/ha_token:/run/secrets/ha_token:ro,z"
      - "./secrets/admin_password:/run/secrets/admin_password:ro,z"
      - "./secrets/admin_session_secret:/run/secrets/admin_session_secret:ro,z"
      - "./secrets/api_key_hash_secret:/run/secrets/api_key_hash_secret:ro,z"
      - "./secrets/alert_webhook_url:/run/secrets/alert_webhook_url:ro,z"
      - "./secrets/smtp_password:/run/secrets/smtp_password:ro,z"
      - "./secrets/alert_ntfy_token:/run/secrets/alert_ntfy_token:ro,z"
      - "./secrets/alert_telegram_bot_token:/run/secrets/alert_telegram_bot_token:ro,z"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The app only writes to /data; everything else is read-only so a compromise cannot persist.
    read_only: true
    tmpfs:
      - /tmp
      - /home/gatekeeper
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *default-logging

  caddy:
    image: "${CADDY_IMAGE:-caddy:2-alpine}"
    container_name: ha-gatekeeper-caddy
    profiles: ["proxy"]
    restart: unless-stopped
    mem_limit: "${CADDY_MEM_LIMIT:-384m}"
    memswap_limit: "${CADDY_MEM_LIMIT:-384m}"
    pids_limit: 512
    stop_grace_period: 20s
    depends_on:
      gatekeeper:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Directory (not a single file) so edits are always seen and Docker can never create a
      # bogus directory named Caddyfile when the file is missing.
      - "./deploy/caddy:/etc/caddy:ro,z"
      # Certificates and the ACME account live here. Do not delete this volume needlessly:
      # Let's Encrypt rate-limits re-issuing certificates.
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    # Only what a web server needs: bind ports 80/443. Everything else is dropped or read-only.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--tries=1", "--timeout=3", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
